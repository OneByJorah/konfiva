name: Screenshots

# Manual or on push to main. Never on pull requests from forks.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: write
  pull-requests: write

# A push and a manual run can race on the same bot branch; keep one.
concurrency:
  group: screenshots-${{ github.repository }}
  cancel-in-progress: false

jobs:
  screenshots:
    uses: ./.github/workflows/reusable-screenshots.yml
    with:
      # The demo stack listens on 127.0.0.1:8103 with its health endpoint at /api/v1/health.
      base-url: http://127.0.0.1:8103
      health-url: http://127.0.0.1:8103/api/v1/health
    # To use your self-hosted runner (trusted events only):
    #   runner: self-hosted
    #   install-deps: false
